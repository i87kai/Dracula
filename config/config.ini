; ============================================================================
;  Sandbox Orchestrator & Dynamic Execution Tracer Configuration
; ============================================================================

[QEMU]
qemu_executable = C:\Program Files\qemu\qemu-system-x86_64.exe
bios_path = C:\Program Files\qemu\share\edk2-x86_64-code.fd
uefi_vars_path = D:\VirtualMachines\uefi_vars.fd
disk_path = D:\VirtualMachines\win10.vdi
guest_share_dir = guest_share
memory = 4G
smp_cores = 2
accelerators = whpx:tcg
headless = false

[Network]
; The guest dials OUT to the host through the QEMU SLIRP gateway at 10.0.2.2.
; The host never connects into the guest, so no inbound port forwarding is used
; or needed, and QEMU never contends for the port the host listener holds.
host_listen_ip = 0.0.0.0
host_listen_port = 8899

; How the host listener picks its port:
;   fixed                 use host_listen_port only, fail if it is taken
;   preferred-then-range  try host_listen_port, then scan the range (default)
;   ephemeral             let the OS assign any free port
; The actual port is written into the guest share as dracula_session.ini so the
; GuestAgent always knows where to connect.
port_strategy = preferred-then-range
port_range_begin = 8899
port_range_end = 8999

; How long to wait for the GuestAgent to dial in before reporting that it never
; connected. Windows guests need time to boot and auto-login.
guest_connect_timeout_seconds = 240

[Tracing]
monitor_stdout = true
monitor_processes = true
monitor_files = true
monitor_registry = true
monitor_network = true
execution_timeout_seconds = 60
guest_target_dir = C:\Sandbox\

[Tools]
yara_executable = tools/yara64.exe
yara_rules_path = rules/packers.yar
pe_sieve_path = tools/pe-sieve64.exe
default_report = sandbox_report.txt
